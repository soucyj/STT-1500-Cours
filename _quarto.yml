          - exercices/sources.qmd
      - href: laboratoires/index.qmd
        text: Laboratoires
      - href: ressources.qmd
        text: Ressources
  page-footer:
    center: |
      © 2026 Jérôme Soucy — Université Laval, Département de mathématiques et de statistique

# Solutions publiées à une date précise : voir filtres/solutions.lua
filters:
  - filtres/solutions.lua
  - filtres/lien-fiche.lua

format:
  html:
    theme: [cosmo, styles/cours.scss]
    css: styles/polices.css
    toc: true
    toc-title: "Sur cette page"
    toc-location: left
    html-math-method: mathjax
    code-copy: true
    highlight-style: github
