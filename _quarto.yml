# ═══════════════════════════════════════════════════════════════════════
#  STT-1500 — Probabilités : site du cours
#    quarto preview   → aperçu qui se met à jour en direct
#    quarto render    → le site complet dans _site/
# ═══════════════════════════════════════════════════════════════════════
project:
  type: website
  output-dir: _site

lang: fr

website:
  title: "STT-1500"
  description: "Probabilités — site du cours"
  search: true
  page-navigation: true
  # Barre latérale comme celle du livre (style « floating », fond en
  # dégradé défini dans styles/cours.scss).
  sidebar:
    style: floating
    search: true
    title: "STT-1500"
    contents:
      - href: index.qmd
        text: Accueil
      - href: plan.qmd
        text: Plan de cours
      - href: calendrier.qmd
        text: Calendrier
      - href: livre.qmd
        text: Notes de cours
      - href: presentations/index.qmd
        text: Présentations
      - section: Exercices
        href: exercices/index.qmd
        contents:
          - exercices/01-introduction.qmd
          - exercices/02-denombrement.qmd
          - exercices/03-conditionnelle-independance.qmd
          - exercices/04-fondements.qmd
          - exercices/05-probabilites-geometriques.qmd
          - exercices/sources.qmd
      - href: laboratoires/index.qmd
        text: Laboratoires
      - href: ressources.qmd
        text: Ressources
  page-footer:
    center: |
      © 2026 Jérôme Soucy — Université Laval, Département de mathématiques et de statistique

# Solutions publiées à une date précise : voir filtres/solutions.lua
filters:
  - filtres/solutions.lua

format:
  html:
    theme: [cosmo, styles/cours.scss]
    css: styles/polices.css
    toc: true
    toc-title: "Sur cette page"
    toc-location: left
    html-math-method: mathjax
    code-copy: true
    highlight-style: github
