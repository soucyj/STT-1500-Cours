# ═══════════════════════════════════════════════════════════════════════
#  MAT-2901 — Mathématiques et technologie : site du cours
#    quarto preview   → aperçu qui se met à jour en direct
#    quarto render    → le site complet dans _site/
#  Le livre et les présentations Beamer vivent dans le dépôt du livre
#  (LivreMathTechno) ; ce site y renvoie par des liens. Toutes les
#  adresses externes sont dans _variables.yml.
# ═══════════════════════════════════════════════════════════════════════
project:
  type: website
  output-dir: _site

lang: fr

website:
  title: "MAT-2901"
  description: "Mathématiques et technologie — site du cours"
  search: true
  page-navigation: true
  # Barre latérale comme celle du livre (style « floating », fond en
  # dégradé défini dans styles/cours.scss).
  sidebar:
    style: floating
    search: true
    title: "MAT-2901"
    contents:
      - href: index.qmd
        text: Accueil
      - href: plan.qmd
        text: Plan de cours
      - href: calendrier.qmd
        text: Calendrier
      - href: livre.qmd
        text: Le livre
      - href: presentations/index.qmd
        text: Présentations
      - section: Laboratoires
        href: laboratoires/index.qmd
        contents:
          - laboratoires/latex.qmd
      - href: ressources.qmd
        text: Ressources
  page-footer:
    center: |
      © 2026 Jérôme Soucy — Université Laval, Département de mathématiques et de statistique

# Solutions publiées à une date précise : voir filtres/solutions.lua
filters:
  - filtres/solutions.lua

format:
  html:
    theme: [cosmo, styles/cours.scss]
    css: styles/polices.css
    toc: true
    toc-title: "Sur cette page"
    toc-location: left
    html-math-method: mathjax
    code-copy: true
    highlight-style: github
